login:
  first_name: Example
  last_name: Resident
  password: replace-me
  channel: Munibot
  version: 0.1.0
  start: last
  login_uri: https://login.agni.lindenlab.com/cgi-bin/login.cgi
  timeout_seconds: 60

  # Optional, only if the account is challenged for MFA.
  # mfa_token: "123456"
  # mfa_hash: ""

runtime:
  # 0 means stay online until Ctrl+C. Use a short value for a login smoke test.
  exit_after_login_seconds: 0
  reconnect: true
  reconnect_delay_seconds: 15
  # 0 means retry forever.
  max_reconnect_attempts: 0
  # Sends periodic AgentUpdate packets so the simulator UDP circuit does not sit idle.
  # Set to 0 to disable.
  movement_keepalive_seconds: 20

api:
  group_roster_timeout_seconds: 30
  avatar_lookup_timeout_seconds: 30
  group_operation_timeout_seconds: 30
  inventory_operation_timeout_seconds: 30
  texture_upload_timeout_seconds: 60
  wallet_operation_timeout_seconds: 30

account_history:
  # Optional. Defaults to login first_name + last_name when omitted.
  # username: Example Resident
  # Uses login.password for the Second Life web account login.
  timeout_seconds: 45

munibase:
  wallet_events:
    # Optional. When configured, Munibot posts Corrade-compatible economy callbacks
    # into a trusted callback endpoint.
    # endpoint_url: https://example.com/webhooks/second-life-money
    # shared_secret: replace-with-callback-secret
    timeout_seconds: 10
    max_delivery_attempts: 3
    retry_delay_seconds: 2
    # When Second Life only reports a balance increase, Munibot reconciles recent
    # account history and publishes matching incoming payments to Munibase.
    history_lookback_minutes: 10
    history_reconcile_attempts: 3
    history_reconcile_delay_seconds: 5

diagnostics:
  log_api_calls: true
  # Enables small, redacted JSON request/response body logging.
  log_api_bodies: false
  log_second_life_events: true
  max_logged_body_bytes: 4096

experiences:
  # Persistent allowlist for trusted SL experiences the bot should accept.
  # Use the API/logged ExperienceEvent params to identify the UUID, then add it here.
  auto_allow: []
  # auto_allow:
  #   - id: 00000000-0000-0000-0000-000000000000
  #     name: Example Region Experience

# If no tokens are configured, API calls are allowed for local development.
# Configure tokens in production. Send either X-Munibot-Token or Authorization: Bearer.
tokens:
  - id: munibase
    value: replace-with-long-random-token
    scopes:
      - sl.roster.read
      - sl.group.invite
      - sl.group.eject
      - sl.group.ban.read
      - sl.group.ban.write
      - sl.group.roles.read
      - sl.avatar.resolve
      - sl.im.send
      - sl.localchat.send
      - sl.texture.upload
      - sl.inventory.give
      - sl.wallet.read
      - sl.wallet.history
      - sl.wallet.pay
      - sl.estate.read
      - sl.estate.write
      - sl.bot.teleport
      - sl.bot.owner
